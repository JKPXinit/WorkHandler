<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>WorkHandler | Issue 工作台</title>
<style>
:root {
  --blue: #0066cc;
  --blue-focus: #0071e3;
  --blue-dark: #2997ff;
  --ink: #1d1d1f;
  --ink-soft: #333333;
  --muted: #7a7a7a;
  --canvas: #ffffff;
  --parchment: #f5f5f7;
  --pearl: #fafafc;
  --tile-dark: #272729;
  --tile-dark-2: #2a2a2c;
  --black: #000000;
  --hairline: #e0e0e0;
  --dark-line: #48484a;
  --on-dark: #ffffff;
  --on-dark-muted: #cccccc;
  --danger: #8a1c1c;
  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 18px;
  --pill: 9999px;
  --nav-height: 44px;
  --subnav-height: 52px;
  --sidebar-width: 264px;
  --drawer-width: 432px;
  --container: 1440px;
  font-family: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--canvas);
  letter-spacing: 0;
}

* { box-sizing: border-box; letter-spacing: 0; }
html, body { min-width: 320px; min-height: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.47;
}
button, input, select, textarea { font: inherit; letter-spacing: 0; }
button, a { -webkit-tap-highlight-color: transparent; }
button { border: 0; }
button:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--blue-focus);
  outline-offset: 2px;
}
button:active { transform: scale(0.95); }
button:disabled { cursor: not-allowed; opacity: 0.45; transform: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
svg.icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.global-nav {
  height: var(--nav-height);
  background: var(--black);
  color: var(--on-dark);
}
.global-nav-inner {
  width: min(var(--container), calc(100% - 48px));
  height: 100%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 12px;
  line-height: 1;
}
.brand-link { font-weight: 600; margin-right: auto; }
.global-link { color: #d2d2d7; background: transparent; cursor: pointer; padding: 8px 0; }
.global-link:hover { color: var(--on-dark); }
.demo-badge {
  padding: 5px 9px;
  border: 1px solid var(--dark-line);
  border-radius: var(--pill);
  color: #d2d2d7;
  font-size: 10px;
}
.profile-wrap { position: relative; }
.profile-button {
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: var(--on-dark);
  cursor: pointer;
  font-size: 12px;
}
.avatar {
  width: 24px;
  height: 24px;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: #d2d2d7;
  color: var(--ink);
  font-size: 10px;
  font-weight: 600;
}
.profile-menu {
  position: absolute;
  top: 39px;
  right: 0;
  z-index: 80;
  width: 224px;
  padding: 8px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--canvas);
  color: var(--ink);
}
.profile-summary { padding: 10px 12px 12px; border-bottom: 1px solid var(--hairline); }
.profile-summary strong, .profile-summary span { display: block; overflow-wrap: anywhere; }
.profile-summary span { margin-top: 3px; color: var(--muted); font-size: 12px; }
.menu-action {
  width: 100%;
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  font-size: 14px;
}
.menu-action:hover { background: var(--parchment); }

.sub-nav {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--subnav-height);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  background: rgba(245,245,247,0.92);
  backdrop-filter: saturate(180%) blur(20px);
}
.sub-nav-inner {
  width: min(var(--container), calc(100% - 48px));
  height: 100%;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
}
.sub-title {
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.19;
}
.sub-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.sub-search { position: relative; width: min(360px, 32vw); margin-left: auto; }
.sub-search svg { position: absolute; left: 14px; top: 13px; color: var(--muted); pointer-events: none; }
.sub-search input {
  width: 100%;
  height: 40px;
  padding: 8px 16px 8px 42px;
  border: 1px solid rgba(0,0,0,0.08);
  border-radius: var(--pill);
  background: var(--canvas);
  color: var(--ink);
  font-size: 14px;
}
.btn {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 22px;
  border: 1px solid transparent;
  border-radius: var(--pill);
  background: var(--blue);
  color: var(--on-dark);
  cursor: pointer;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.2;
}
.btn:hover { background: var(--blue-focus); }
.btn-secondary { border-color: var(--blue); background: transparent; color: var(--blue); }
.btn-secondary:hover { background: var(--blue); color: var(--on-dark); }
.btn-utility {
  min-height: 38px;
  padding: 8px 15px;
  border-radius: var(--radius-sm);
  background: var(--ink);
  color: var(--on-dark);
  font-size: 14px;
}
.btn-utility:hover { background: var(--tile-dark-2); }
.btn-ghost {
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  background: var(--pearl);
  color: var(--ink-soft);
  font-size: 14px;
}
.btn-ghost:hover { border-color: var(--blue); color: var(--blue); }
.btn-danger { border-color: #d6b6b6; background: var(--canvas); color: var(--danger); }
.btn-danger:hover { border-color: var(--danger); background: #fff7f7; color: var(--danger); }
.icon-button {
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 44px;
  border: 1px solid var(--hairline);
  border-radius: 50%;
  background: var(--canvas);
  color: var(--ink);
  cursor: pointer;
}
.icon-button:hover { border-color: var(--blue); color: var(--blue); }
.icon-button.dark { border-color: var(--dark-line); background: var(--tile-dark); color: var(--on-dark); }
.icon-button.small { width: 34px; height: 34px; min-height: 34px; flex-basis: 34px; }

.login-view {
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  grid-template-rows: var(--nav-height) 1fr auto;
  background: var(--tile-dark);
}
.login-main {
  display: grid;
  place-items: center;
  padding: 64px 24px;
  color: var(--on-dark);
}
.login-layout {
  width: min(980px, 100%);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(360px, 420px);
  gap: 80px;
  align-items: center;
}
.login-brand { min-width: 0; }
.brand-asset {
  width: 112px;
  height: 112px;
  margin-bottom: 32px;
  border-radius: 24px;
  object-fit: cover;
  box-shadow: rgba(0,0,0,0.22) 3px 5px 30px 0;
}
.login-brand h1 {
  margin: 0;
  font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
  font-size: 56px;
  font-weight: 600;
  line-height: 1.07;
  letter-spacing: 0;
}
.login-brand p {
  margin: 18px 0 0;
  color: var(--on-dark-muted);
  font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
  font-size: 24px;
  font-weight: 300;
  line-height: 1.5;
}
.login-form {
  padding: 32px;
  border: 1px solid var(--dark-line);
  border-radius: var(--radius-lg);
  background: #1d1d1f;
}
.login-form h2 { margin: 0 0 24px; font-size: 21px; font-weight: 600; }
.form-stack { display: grid; gap: 17px; }
.field { min-width: 0; }
.field label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  background: var(--canvas);
  color: var(--ink);
  font-size: 17px;
}
.field textarea { min-height: 132px; resize: vertical; line-height: 1.47; }
.login-form .field input { border-color: var(--dark-line); background: var(--tile-dark); color: var(--on-dark); }
.field-error { min-height: 20px; margin-top: 6px; color: #ffb4ab; font-size: 12px; }
.login-actions { margin-top: 24px; display: flex; align-items: center; gap: 14px; }
.login-actions .btn { min-width: 118px; }
.service-state { color: var(--on-dark-muted); font-size: 12px; }
.service-state.ok { color: var(--blue-dark); }
.demo-roles { display: flex; gap: 8px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--dark-line); }
.demo-role {
  min-height: 36px;
  flex: 1;
  border: 1px solid var(--dark-line);
  border-radius: var(--pill);
  background: transparent;
  color: var(--on-dark-muted);
  cursor: pointer;
  font-size: 12px;
}
.demo-role:hover { border-color: var(--blue-dark); color: var(--blue-dark); }
.login-footer {
  padding: 24px;
  background: var(--parchment);
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  line-height: 2.41;
}

.app-view { min-height: 100vh; background: var(--canvas); }
.app-view.detail-mode .sub-search,
.app-view.detail-mode #createIssueButton,
.app-view.detail-mode #mobilePanelsButton { display: none !important; }
.workspace {
  min-height: calc(100vh - var(--nav-height) - var(--subnav-height));
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  max-width: var(--container);
  margin: 0 auto;
}
.workspace.detail-open { display: block; }
.workspace.detail-open .sidebar,
.workspace.detail-open .issue-main { display: none; }
.sidebar {
  min-width: 0;
  border-right: 1px solid var(--hairline);
  background: var(--parchment);
}
.sidebar-inner {
  position: sticky;
  top: var(--subnav-height);
  height: calc(100vh - var(--subnav-height));
  display: flex;
  flex-direction: column;
  padding: 24px 16px 16px;
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 16px; }
.sidebar-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.panel-list { min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 4px; }
.panel-item { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 4px; }
.panel-select {
  width: 100%;
  min-height: 44px;
  display: grid;
  grid-template-columns: 10px minmax(0,1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.panel-select:hover, .panel-select.active { background: var(--canvas); }
.panel-select.active { color: var(--blue); }
.panel-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
.panel-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
.panel-count { color: var(--muted); font-size: 12px; }
.panel-tools { display: flex; }
.panel-tool {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.panel-tool:hover { background: var(--canvas); color: var(--blue); }
.panel-tool svg { width: 14px; height: 14px; }
.sidebar-foot { margin-top: auto; padding: 16px 8px 0; border-top: 1px solid var(--hairline); color: var(--muted); font-size: 12px; }
.sidebar-foot strong { display: block; color: var(--ink); font-size: 14px; overflow-wrap: anywhere; }
.sidebar-backdrop { display: none; }

.issue-main { min-width: 0; background: var(--canvas); }
.metrics-band {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  border-bottom: 1px solid var(--hairline);
  background: var(--parchment);
}
.metric { min-width: 0; padding: 20px 24px; border-right: 1px solid var(--hairline); }
.metric:last-child { border-right: 0; }
.metric-label { display: block; color: var(--muted); font-size: 12px; }
.metric-value { display: block; margin-top: 4px; font-size: 24px; font-weight: 600; line-height: 1.2; }
.filter-band {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--hairline);
}
.segmented {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--parchment);
}
.segmented button {
  min-height: 30px;
  padding: 5px 11px;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
}
.segmented button.active { background: var(--blue); color: var(--on-dark); }
.filter-select {
  min-height: 38px;
  max-width: 170px;
  padding: 7px 32px 7px 11px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--canvas);
  color: var(--ink);
  font-size: 12px;
}
.filter-clear { margin-left: auto; background: transparent; color: var(--blue); cursor: pointer; font-size: 12px; }
.issue-table { min-width: 0; }
.issue-header, .issue-row {
  display: grid;
  grid-template-columns: minmax(220px,1fr) 112px 90px 150px 132px 62px;
  align-items: center;
  column-gap: 12px;
}
.issue-header {
  min-height: 42px;
  padding: 0 24px;
  border-bottom: 1px solid var(--hairline);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.issue-row {
  width: 100%;
  min-height: 68px;
  padding: 10px 24px;
  border-bottom: 1px solid var(--hairline);
  background: var(--canvas);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.issue-row:hover { background: var(--pearl); }
.issue-row:focus-visible { outline: 2px solid var(--blue-focus); outline-offset: -2px; }
.issue-title { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; }
.issue-title-copy { min-width: 0; }
.issue-title-copy strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
.issue-title-copy span { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.task-id {
  min-height: 26px;
  padding: 4px 8px;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  background: var(--pearl);
  color: var(--blue);
  cursor: copy;
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
  white-space: nowrap;
}
.task-id:hover { border-color: var(--blue); background: var(--canvas); }
.issue-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  max-width: 100%;
  padding: 5px 10px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: var(--pearl);
  color: var(--ink-soft);
  font-size: 12px;
  white-space: nowrap;
}
.chip.active { border-color: var(--blue); color: var(--blue); }
.attachment-cell { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.list-state {
  min-height: 320px;
  display: grid;
  place-items: center;
  padding: 48px 24px;
  color: var(--muted);
  text-align: center;
}
.list-state-inner { max-width: 420px; }
.list-state h3 { margin: 0; color: var(--ink); font-size: 21px; font-weight: 600; }
.list-state p { margin: 8px 0 0; font-size: 14px; }

.issue-detail-view { min-width: 0; background: var(--canvas); }
.detail-page-head {
  min-height: 104px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 32px;
  border-bottom: 1px solid var(--hairline);
  background: var(--canvas);
}
.detail-heading { min-width: 0; flex: 1; }
.detail-heading-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.detail-kicker { margin: 0; color: var(--muted); font-size: 12px; }
.detail-title {
  margin: 0;
  font-family: "SF Pro Display", system-ui, -apple-system, sans-serif;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.2;
  overflow-wrap: anywhere;
}
.detail-head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.detail-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; align-items: start; }
.detail-conversation { min-width: 0; padding: 32px; border-right: 1px solid var(--hairline); }
.detail-sidebar { min-width: 0; position: sticky; top: var(--subnav-height); padding: 8px 24px 32px; }
.detail-section { padding: 24px 0; border-bottom: 1px solid var(--hairline); }
.detail-section:last-child { border-bottom: 0; }
.detail-section h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
.detail-description { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
.meta-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.meta-item span { display: block; color: var(--muted); font-size: 11px; }
.meta-item strong { display: block; margin-top: 3px; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; }
.status-flow { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.status-button {
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  background: var(--canvas);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
}
.status-button.active { border-color: var(--blue); background: var(--pearl); color: var(--blue); }
.attachment-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.attachment-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  background: var(--pearl);
}
.attachment-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--parchment); }
.attachment-meta { display: flex; align-items: center; gap: 8px; padding: 9px 10px; }
.attachment-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.attachment-delete { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
.attachment-delete:hover { color: var(--danger); }
.upload-label {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 15px;
  border: 1px solid var(--blue);
  border-radius: var(--pill);
  color: var(--blue);
  cursor: pointer;
  font-size: 14px;
}
.upload-label input { display: none; }
.comment-list { display: grid; gap: 0; }
.comment { display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--hairline); }
.comment:first-child { padding-top: 0; }
.comment .avatar { width: 36px; height: 36px; }
.comment-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.comment-head span { color: var(--muted); white-space: nowrap; }
.comment-body { margin: 4px 0 0; overflow-wrap: anywhere; color: var(--ink-soft); font-size: 13px; white-space: pre-wrap; }
.comment-body .comment-image { display: inline-block; max-width: 100%; margin: 8px 8px 2px 0; vertical-align: top; border: 0; background: transparent; cursor: zoom-in; }
.comment-body .comment-image img { display: block; width: min(180px, 100%); aspect-ratio: 4/3; object-fit: cover; border: 1px solid var(--hairline); background: var(--parchment); }
.comment-file { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; margin: 8px 8px 2px 0; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--pearl); color: var(--ink-soft); vertical-align: middle; text-decoration: none; }
.comment-file:hover { border-color: var(--blue); color: var(--blue); }
.comment-file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comment-file-size { color: var(--muted); font-size: 11px; white-space: nowrap; }
.comment-composer-tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.comment-image-hint { color: var(--muted); font-size: 11px; }
.comment-file-list { display: grid; gap: 6px; }
.comment-file-row { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 8px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--pearl); }
.comment-file-row .comment-file-name { flex: 1; font-size: 12px; }
.comment-file-remove { width: 26px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
.comment-file-remove:hover { color: var(--danger); }
.comment-form { display: grid; gap: 10px; margin-top: 18px; }
.comment-form textarea {
  width: 100%;
  min-height: 88px;
  padding: 10px 12px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  resize: vertical;
  color: var(--ink);
  font-size: 14px;
}

dialog {
  width: min(640px, calc(100% - 32px));
  max-height: calc(100vh - 48px);
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  background: var(--canvas);
  color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,0.46); }
#imagePreviewDialog { width: min(1100px, calc(100% - 32px)); background: #111; }
#imagePreviewDialog .icon-button { position: absolute; top: 12px; right: 12px; z-index: 1; background: rgba(255,255,255,0.92); }
#imagePreview { display: block; width: 100%; max-height: calc(100vh - 48px); object-fit: contain; }
.dialog-shell { max-height: calc(100vh - 48px); display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.dialog-head { min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 24px; border-bottom: 1px solid var(--hairline); }
.dialog-head h2 { flex: 1; margin: 0; font-size: 21px; font-weight: 600; }
.dialog-body { min-height: 0; overflow-y: auto; padding: 24px; }
.dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--hairline); background: var(--parchment); }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 17px; }
.field-wide { grid-column: 1/-1; }
.color-options { display: flex; flex-wrap: wrap; gap: 10px; }
.color-choice { position: relative; }
.color-choice input { position: absolute; opacity: 0; pointer-events: none; }
.color-swatch { width: 44px; height: 44px; display: block; border: 3px solid var(--canvas); border-radius: 50%; background: var(--swatch); outline: 1px solid var(--hairline); cursor: pointer; }
.color-choice input:checked + .color-swatch { outline: 2px solid var(--blue-focus); outline-offset: 2px; }
.confirm-copy { margin: 0; color: var(--ink-soft); overflow-wrap: anywhere; }
.confirm-copy strong { color: var(--ink); }

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 120;
  max-width: min(420px, calc(100% - 48px));
  padding: 13px 18px;
  border: 1px solid var(--hairline);
  border-radius: var(--pill);
  background: var(--canvas);
  color: var(--ink);
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 1068px) {
  .workspace { grid-template-columns: 232px minmax(0,1fr); }
  .detail-layout { grid-template-columns: minmax(0,1fr) 280px; }
  .detail-page-head, .detail-conversation { padding-left: 24px; padding-right: 24px; }
  .issue-header, .issue-row { grid-template-columns: minmax(200px,1fr) 104px 82px 124px 56px; }
  .issue-header > :nth-child(5), .issue-row > :nth-child(5) { display: none; }
}
@media (max-width: 833px) {
  .global-nav-inner, .sub-nav-inner { width: min(var(--container), calc(100% - 32px)); }
  .global-link { display: none; }
  .workspace { grid-template-columns: minmax(0,1fr); }
  .sidebar {
    position: fixed;
    top: calc(var(--nav-height) + var(--subnav-height));
    left: 0;
    bottom: 0;
    z-index: 65;
    width: min(320px, calc(100% - 48px));
    border-right: 1px solid var(--hairline);
    transform: translateX(-102%);
    transition: transform 180ms ease;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-inner { position: static; height: 100%; }
  .sidebar-backdrop {
    position: fixed;
    inset: calc(var(--nav-height) + var(--subnav-height)) 0 0;
    z-index: 60;
    background: rgba(0,0,0,0.36);
  }
  .sidebar-backdrop.show { display: block; }
  .mobile-panels { display: inline-grid !important; }
  .sub-search { width: min(280px, 38vw); }
  .issue-header, .issue-row { grid-template-columns: minmax(180px,1fr) 104px 82px 56px; }
  .issue-header > :nth-child(4), .issue-row > :nth-child(4) { display: none; }
  .detail-layout { grid-template-columns: minmax(0,1fr); }
  .detail-conversation { border-right: 0; }
  .detail-sidebar { position: static; border-top: 1px solid var(--hairline); }
}
@media (max-width: 640px) {
  .login-main { padding: 48px 16px; }
  .login-layout { grid-template-columns: 1fr; gap: 40px; }
  .login-brand { text-align: center; }
  .brand-asset { width: 88px; height: 88px; margin: 0 auto 24px; border-radius: 20px; }
  .login-brand h1 { font-size: 34px; line-height: 1.2; }
  .login-brand p { font-size: 21px; }
  .login-form { padding: 24px; }
  #appDemoBadge { display: none; }
  .profile-button .profile-name { display: none; }
  .sub-count { display: none; }
  .sub-title { max-width: 132px; font-size: 17px; }
  .sub-search { display: none; }
  .sub-nav-inner .btn { margin-left: auto; min-height: 40px; padding: 8px 15px; font-size: 14px; }
  .metrics-band { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .metric { padding: 16px; }
  .metric:nth-child(2) { border-right: 0; }
  .metric:nth-child(-n+2) { border-bottom: 1px solid var(--hairline); }
  .metric-value { font-size: 21px; }
  .filter-band { padding: 12px 16px; }
  .segmented { width: 100%; overflow-x: auto; }
  .segmented button { flex: 1; }
  .filter-select { flex: 1; max-width: none; }
  .filter-clear { margin-left: 0; }
  .issue-header { display: none; }
  .issue-row {
    min-height: 92px;
    grid-template-columns: minmax(0,1fr) auto;
    grid-template-areas: "title status" "title priority";
    row-gap: 7px;
    padding: 14px 16px;
  }
  .issue-row .issue-title { grid-area: title; align-self: center; }
  .issue-row > :nth-child(2) { grid-area: status; }
  .issue-row > :nth-child(3) { grid-area: priority; }
  .issue-row > :nth-child(n+4) { display: none; }
  .detail-page-head { align-items: flex-start; flex-wrap: wrap; padding: 18px 16px; }
  .detail-heading { order: 2; flex-basis: calc(100% - 52px); }
  .detail-head-actions { order: 3; width: 100%; justify-content: flex-start; }
  .detail-conversation, .detail-sidebar { padding: 20px 16px; }
  .detail-title { font-size: 24px; }
  .attachment-grid { grid-template-columns: 1fr; }
  dialog { width: 100%; max-width: none; max-height: 100vh; height: 100vh; border: 0; border-radius: 0; }
  .dialog-shell { max-height: 100vh; height: 100%; }
  .dialog-body { padding: 20px 16px; }
  .dialog-actions { padding: 14px 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .field-wide { grid-column: auto; }
  .dialog-actions .btn, .dialog-actions .btn-ghost { flex: 1; }
  .toast { right: 16px; bottom: 16px; max-width: calc(100% - 32px); border-radius: var(--radius-md); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(window.location.search);
  var storageKeys = { baseUrl: 'workhandler.apiBase', token: 'workhandler.token' };
  var liveServerOrigin = /^55\d{2}$/.test(window.location.port) && /\/Source\/html\//i.test(window.location.pathname);
  var savedBaseUrl = localStorage.getItem(storageKeys.baseUrl);
  var defaultBaseUrl = liveServerOrigin
    ? window.location.protocol + '//' + (window.location.hostname || '127.0.0.1') + ':8080'
    : /^https?:$/.test(window.location.protocol) ? window.location.origin : 'http://127.0.0.1:8080';

  var state = {
    demo: params.get('demo') === '1',
    baseUrl: params.get('api') || savedBaseUrl || defaultBaseUrl,
    token: sessionStorage.getItem(storageKeys.token) || '',
    currentUser: null,
    blocks: [],
    issues: [],
    userOptions: [],
    selectedBlockId: null,
    selectedIssueId: null,
    selectedTaskId: null,
    selectedIssue: null,
    comments: [],
    commentImages: [],
    attachmentObjectUrls: [],
    attachmentPreviewUrls: [],
    attachmentLoadVersion: 0,
    filters: { status: '', priority: '', assignee: '', sort: 'created_desc', q: '' },
    sidebarOpen: false,
    returnHash: null,
    returnScrollY: 0,
    confirmAction: null,
    modalMode: '',
    editingId: null,
    demoRole: 'admin'
  };

  var labels = {
    status: { open: '待处理', in_progress: '进行中', resolved: '已解决', closed: '已关闭' },
    priority: { low: '低', medium: '中', high: '高' },
    role: { admin: '管理员', user: '用户', guest: '访客' }
  };

  function icon(name) {
    return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function initials(user) {
    var text = user && (user.display_name || user.username) || 'W';
    return text.trim().slice(0, 2).toUpperCase();
  }

  function displayName(user) {
    return user && (user.display_name || user.username) || '未分配';
  }

  function formatTaskId(issueId) {
    var numericId = Number(issueId);
    return Number.isSafeInteger(numericId) && numericId > 0 ? 'T' + numericId : '';
  }

  function parseTaskId(identifier) {
    var text = String(identifier === null || identifier === undefined ? '' : identifier);
    var match = text.match(/^[Tt]?([1-9]\d*)$/);
    if (!match) return null;
    var numericId = Number(match[1]);
    return Number.isSafeInteger(numericId) ? numericId : null;
  }

  function taskIdFor(issue) {
    return issue && issue.task_id || formatTaskId(issue && issue.id !== undefined ? issue.id : issue);
  }

  function normalizeIssue(issue) {
    if (!issue) return issue;
    issue.task_id = taskIdFor(issue);
    return issue;
  }

  function formatDate(value) {
    if (!value) return '-';
    var date = new Date(String(value).replace(' ', 'T') + (String(value).indexOf('Z') < 0 ? 'Z' : ''));
    if (Number.isNaN(date.getTime())) return String(value);
    return new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(date);
  }

  function normalizeBaseUrl(value) {
    var url = new URL(value || defaultBaseUrl, window.location.href);
    if (!/^https?:$/.test(url.protocol)) throw new Error('API 地址必须使用 HTTP 或 HTTPS');
    return url.origin;
  }

  function showToast(message) {
    var toast = $('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(function () { toast.classList.remove('show'); }, 2800);
  }

  function setBusy(button, busy, busyText) {
    if (!button) return;
    if (busy) {
      button.dataset.label = button.textContent;
      button.textContent = busyText || '处理中';
      button.disabled = true;
    } else {
      button.textContent = button.dataset.label || button.textContent;
      button.disabled = false;
    }
  }

  function success(data, status) {
    return { ok: true, status: status || 200, data: data || {}, error: null };
  }

  function failure(status, code, message) {
    return { ok: false, status: status, data: null, error: { code: code, message: message } };
  }

  function resultMessage(result, fallback) {
    return result && result.error && result.error.message || fallback;
  }

  function makeDemoStore() {
    var users = [
      { id: 1, username: 'admin', display_name: '管理员', role: 'admin' },
      { id: 2, username: 'operator', display_name: '陈默', role: 'user' },
      { id: 3, username: 'viewer', display_name: '李然', role: 'guest' }
    ];
    var blocks = [
      { id: 1, title: '本周工作', description: '本周需要推进的事项', color: '#0066cc', sort_order: 0 },
      { id: 2, title: '版本发布', description: '发布前的核对和修复', color: '#5856d6', sort_order: 1 },
      { id: 3, title: '待整理', description: '尚未排期的想法和请求', color: '#7a7a7a', sort_order: 2 }
    ];
    var issues = [
      { id: 101, block_id: 1, title: '完成阶段二工作台界面', description: '将阶段一 API 工作台替换为面向日常使用的 Issue 工作区，并完成响应式适配。', status: 'in_progress', priority: 'high', reporter_id: 1, assignee_id: 2, created_at: '2026-07-22T08:30:00Z' },
      { id: 102, block_id: 1, title: '确认面板与 Issue API 契约', description: '核对列表筛选、负责人摘要以及附件接口的返回结构。', status: 'open', priority: 'high', reporter_id: 2, assignee_id: 2, created_at: '2026-07-22T09:10:00Z' },
      { id: 103, block_id: 1, title: '补充移动端布局验收', description: '检查 390px 宽度下筛选、列表、详情和模态框是否存在溢出。', status: 'resolved', priority: 'medium', reporter_id: 2, assignee_id: 3, created_at: '2026-07-21T06:20:00Z' },
      { id: 104, block_id: 2, title: '整理 v0.5 发布清单', description: '汇总阶段二验收项并记录尚未完成的后端接口。', status: 'open', priority: 'medium', reporter_id: 1, assignee_id: 1, created_at: '2026-07-20T03:05:00Z' },
      { id: 105, block_id: 2, title: '验证局域网浏览器访问', description: '使用同网段设备验证登录、列表读取和图片访问。', status: 'closed', priority: 'low', reporter_id: 1, assignee_id: 2, created_at: '2026-07-18T10:45:00Z' },
      { id: 106, block_id: 3, title: '评估 Issue 导出格式', description: '记录后续 CSV 或 JSON 导出的字段需求。', status: 'open', priority: 'low', reporter_id: 2, assignee_id: null, created_at: '2026-07-17T02:15:00Z' }
    ];
    var comments = [
      { id: 1, issue_id: 101, user_id: 1, content: '先完成前端主流程，后端按已确认契约接入。\n![界面](attachment:1)', created_at: '2026-07-22T09:00:00Z' },
      { id: 2, issue_id: 101, user_id: 2, content: '列表、详情和演示数据已经进入同一套状态模型。', created_at: '2026-07-22T10:30:00Z' },
      { id: 3, issue_id: 102, user_id: 2, content: '普通用户需要一个只读负责人选项接口。', created_at: '2026-07-22T11:10:00Z' }
    ];
    var attachments = [
      { id: 1, issue_id: 101, comment_id: 1, uploader_id: 2, filename: 'workhandler-ui.png', file_size: 10233, created_at: '2026-07-22T10:40:00Z', demo_asset: true }
    ];
    return { users: users, blocks: blocks, issues: issues, comments: comments, attachments: attachments };
  }

  var demo = makeDemoStore();

  function demoUser() {
    return demo.users.find(function (user) { return user.role === state.demoRole; }) || demo.users[0];
  }

  function withIssueRelations(issue) {
    var copy = Object.assign({}, issue);
    copy.task_id = formatTaskId(issue.id);
    copy.reporter = demo.users.find(function (user) { return user.id === issue.reporter_id; }) || null;
    copy.assignee = demo.users.find(function (user) { return user.id === issue.assignee_id; }) || null;
    copy.comment_count = demo.comments.filter(function (item) { return item.issue_id === issue.id; }).length;
    copy.attachment_count = demo.attachments.filter(function (item) { return item.issue_id === issue.id; }).length;
    return copy;
  }

  function demoRequest(path, options) {
    options = options || {};
    var method = String(options.method || 'GET').toUpperCase();
    var url = new URL(path, 'http://demo.local');
    var pathname = url.pathname;
    var body = options.body || {};

    return new Promise(function (resolve) {
      window.setTimeout(function () {
        var match;
        if (pathname === '/api/health' && method === 'GET') {
          resolve(success({ status: 'running', version: 'demo', address: 'demo://local' }));
          return;
        }
        if (pathname === '/api/auth/login' && method === 'POST') {
          var user = demo.users.find(function (item) { return item.username === body.username; });
          if (!user || !body.password) {
            resolve(failure(401, 'invalid_credentials', '用户名或密码不正确'));
            return;
          }
          state.demoRole = user.role;
          resolve(success({ token: 'demo-token-' + user.role, user: user }));
          return;
        }
        if (pathname === '/api/auth/logout' && method === 'POST') {
          resolve(success({ logged_out: true }));
          return;
        }
        if (pathname === '/api/auth/me' && method === 'GET') {
          resolve(state.token ? success({ user: demoUser() }) : failure(401, 'unauthorized', '请先登录'));
          return;
        }
        if (pathname === '/api/auth/password' && method === 'PUT') {
          resolve(state.demoRole === 'admin'
            ? failure(403, 'admin_password_desktop_only', 'admin 密码只能在桌面程序中修改')
            : success({ token: 'demo-token-' + state.demoRole + '-changed', user: demoUser() }));
          return;
        }
        if (pathname === '/api/users/options' && method === 'GET') {
          resolve(success({ users: demo.users.map(function (user) {
            return { id: user.id, username: user.username, display_name: user.display_name };
          }) }));
          return;
        }
        if (pathname === '/api/blocks' && method === 'GET') {
          var blockRows = demo.blocks.slice().sort(function (a, b) { return a.sort_order - b.sort_order; }).map(function (block) {
            var copy = Object.assign({}, block);
            copy.issue_count = demo.issues.filter(function (issue) { return issue.block_id === block.id; }).length;
            return copy;
          });
          resolve(success({ blocks: blockRows }));
          return;
        }
        if (pathname === '/api/blocks' && method === 'POST') {
          var blockId = demo.blocks.reduce(function (max, block) { return Math.max(max, block.id); }, 0) + 1;
          var createdBlock = {
            id: blockId,
            title: body.title,
            description: body.description || '',
            color: body.color || '#0066cc',
            sort_order: demo.blocks.length
          };
          demo.blocks.push(createdBlock);
          resolve(success({ block: createdBlock }, 201));
          return;
        }
        match = pathname.match(/^\/api\/blocks\/(\d+)$/);
        if (match) {
          var targetBlockId = Number(match[1]);
          var blockIndex = demo.blocks.findIndex(function (item) { return item.id === targetBlockId; });
          if (blockIndex < 0) {
            resolve(failure(404, 'block_not_found', '面板不存在'));
            return;
          }
          if (method === 'GET') {
            resolve(success({ block: demo.blocks[blockIndex] }));
            return;
          }
          if (method === 'PUT') {
            demo.blocks[blockIndex] = Object.assign({}, demo.blocks[blockIndex], body);
            resolve(success({ block: demo.blocks[blockIndex] }));
            return;
          }
          if (method === 'DELETE') {
            demo.blocks.splice(blockIndex, 1);
            var removedIssueIds = demo.issues.filter(function (item) { return item.block_id === targetBlockId; }).map(function (item) { return item.id; });
            demo.issues = demo.issues.filter(function (item) { return item.block_id !== targetBlockId; });
            demo.comments = demo.comments.filter(function (item) { return removedIssueIds.indexOf(item.issue_id) < 0; });
            demo.attachments = demo.attachments.filter(function (item) { return removedIssueIds.indexOf(item.issue_id) < 0; });
            resolve(success({ deleted_id: targetBlockId }));
            return;
          }
        }
        if (pathname === '/api/issues' && method === 'GET') {
          var rows = demo.issues.slice();
          var blockQuery = Number(url.searchParams.get('block_id'));
          var statusQuery = url.searchParams.get('status');
          var priorityQuery = url.searchParams.get('priority');
          var assigneeQuery = Number(url.searchParams.get('assignee_id'));
          var searchQuery = (url.searchParams.get('q') || '').toLowerCase();
          var sortQuery = url.searchParams.get('sort') || 'created_desc';
          if (blockQuery) rows = rows.filter(function (item) { return item.block_id === blockQuery; });
          if (statusQuery) rows = rows.filter(function (item) { return item.status === statusQuery; });
          if (priorityQuery) rows = rows.filter(function (item) { return item.priority === priorityQuery; });
          if (assigneeQuery) rows = rows.filter(function (item) { return item.assignee_id === assigneeQuery; });
          if (searchQuery) rows = rows.filter(function (item) {
            return formatTaskId(item.id).toLowerCase() === searchQuery ||
              item.title.toLowerCase().indexOf(searchQuery) >= 0 || item.description.toLowerCase().indexOf(searchQuery) >= 0;
          });
          var priorityRank = { high: 3, medium: 2, low: 1 };
          rows.sort(function (a, b) {
            if (sortQuery === 'created_asc') return String(a.created_at).localeCompare(String(b.created_at));
            if (sortQuery === 'priority_desc') return (priorityRank[b.priority] || 0) - (priorityRank[a.priority] || 0);
            if (sortQuery === 'title_asc') return a.title.localeCompare(b.title, 'zh-CN');
            return String(b.created_at).localeCompare(String(a.created_at));
          });
          resolve(success({ issues: rows.map(withIssueRelations) }));
          return;
        }
        if (pathname === '/api/issues' && method === 'POST') {
          var current = demoUser();
          var issueId = demo.issues.reduce(function (max, issue) { return Math.max(max, issue.id); }, 100) + 1;
          var createdIssue = {
            id: issueId,
            block_id: Number(body.block_id),
            title: body.title,
            description: body.description || '',
            status: 'open',
            priority: body.priority || 'medium',
            reporter_id: current.id,
            assignee_id: body.assignee_id ? Number(body.assignee_id) : null,
            created_at: new Date().toISOString()
          };
          demo.issues.push(createdIssue);
          resolve(success({ issue: withIssueRelations(createdIssue) }, 201));
          return;
        }
        match = pathname.match(/^\/api\/issues\/([^/]+)\/status$/);
        if (match && method === 'PUT') {
          var statusIssueId = parseTaskId(match[1]);
          if (!statusIssueId) {
            resolve(failure(400, 'invalid_task_id', 'TaskID 格式无效'));
            return;
          }
          var statusIssue = demo.issues.find(function (item) { return item.id === statusIssueId; });
          if (!statusIssue) {
            resolve(failure(404, 'issue_not_found', 'Issue 不存在'));
            return;
          }
          var demoActor = demoUser();
          var statusValue = body && body.status;
          var demoReporter = demoActor.role === 'user' && Number(statusIssue.reporter_id) === Number(demoActor.id);
          var demoAdmin = demoActor.role === 'admin';
          var demoAssignee = demoActor.role === 'user' && Number(statusIssue.assignee_id) === Number(demoActor.id);
          if (!labels.status[statusValue]) {
            resolve(failure(400, 'invalid_issue_status', 'Issue 状态无效'));
            return;
          }
          if (!(demoAdmin || demoReporter || demoAssignee)) {
            resolve(failure(403, 'issue_status_forbidden', '只有创建人、负责人或管理员可以修改 Issue 状态'));
            return;
          }
          if (statusValue === 'closed' && !(demoAdmin || demoReporter)) {
            resolve(failure(403, 'issue_status_forbidden', '只有创建人或管理员可以关闭 Issue'));
            return;
          }
          statusIssue.status = statusValue;
          resolve(success({ issue: withIssueRelations(statusIssue) }));
          return;
        }
        match = pathname.match(/^\/api\/issues\/([^/]+)\/comments$/);
        if (match) {
          var commentIssueId = parseTaskId(match[1]);
          if (!commentIssueId) {
            resolve(failure(400, 'invalid_task_id', 'TaskID 格式无效'));
            return;
          }
          if (method === 'GET') {
            resolve(success({ comments: demo.comments.filter(function (item) { return item.issue_id === commentIssueId; }).map(function (item) {
              var copy = Object.assign({}, item);
              copy.user = demo.users.find(function (user) { return user.id === item.user_id; }) || null;
              copy.attachments = demo.attachments.filter(function (attachment) { return attachment.comment_id === item.id; });
              return copy;
            }) }));
            return;
          }
          if (method === 'POST') {
            var commentId = demo.comments.reduce(function (max, item) { return Math.max(max, item.id); }, 0) + 1;
            var formContent = body instanceof FormData ? String(body.get('content') || '') : String(body.content || '');
            var formFiles = body instanceof FormData ? body.getAll('files') : [];
            var createdAttachments = formFiles.map(function (file, index) {
              var attachmentId = demo.attachments.reduce(function (max, item) { return Math.max(max, item.id); }, 0) + index + 1;
              return {
                id: attachmentId,
                issue_id: commentIssueId,
                comment_id: commentId,
                uploader_id: demoUser().id,
                filename: file.name || 'image.png',
                content_type: file.type || 'application/octet-stream',
                is_image: /^image\//.test(file.type || '') || /\.(png|jpe?g|webp)$/i.test(file.name || ''),
                file_size: file.size || 0,
                created_at: new Date().toISOString(),
                preview_url: URL.createObjectURL(file)
              };
            });
            var createdComment = { id: commentId, issue_id: commentIssueId, user_id: demoUser().id, content: formContent, created_at: new Date().toISOString(), attachments: createdAttachments };
            demo.comments.push(createdComment);
            createdAttachments.forEach(function (attachment) { demo.attachments.push(attachment); });
            createdComment.user = demoUser();
            resolve(success({ comment: createdComment }, 201));
            return;
          }
        }
        match = pathname.match(/^\/api\/attachments\/(\d+)$/);
        if (match && method === 'GET') {
          var demoAttachment = demo.attachments.find(function (item) { return item.id === Number(match[1]); });
          resolve(demoAttachment && demoAttachment.preview_url
            ? { ok: true, status: 200, data: demoAttachment.preview_url, error: null }
            : failure(404, 'attachment_not_found', '图片不存在'));
          return;
        }
        match = pathname.match(/^\/api\/issues\/([^/]+)$/);
        if (match) {
          var targetIssueId = parseTaskId(match[1]);
          if (!targetIssueId) {
            resolve(failure(400, 'invalid_task_id', 'TaskID 格式无效'));
            return;
          }
          var issueIndex = demo.issues.findIndex(function (item) { return item.id === targetIssueId; });
          if (issueIndex < 0) {
            resolve(failure(404, 'issue_not_found', 'Issue 不存在'));
            return;
          }
          if (method === 'GET') {
            resolve(success({ issue: withIssueRelations(demo.issues[issueIndex]) }));
            return;
          }
          if (method === 'PUT') {
            demo.issues[issueIndex] = Object.assign({}, demo.issues[issueIndex], body, {
              block_id: Number(body.block_id || demo.issues[issueIndex].block_id),
              assignee_id: body.assignee_id ? Number(body.assignee_id) : null
            });
            resolve(success({ issue: withIssueRelations(demo.issues[issueIndex]) }));
            return;
          }
          if (method === 'DELETE') {
            demo.issues.splice(issueIndex, 1);
            demo.comments = demo.comments.filter(function (item) { return item.issue_id !== targetIssueId; });
            demo.attachments = demo.attachments.filter(function (item) { return item.issue_id !== targetIssueId; });
            resolve(success({ deleted_id: targetIssueId }));
            return;
          }
        }
        resolve(failure(404, 'not_found', '演示接口不存在'));
      }, 120);
    });
  }

  async function httpRequest(path, options) {
    options = options || {};
    var method = options.method || 'GET';
    var headers = Object.assign({ Accept: 'application/json' }, options.headers || {});
    if (options.auth !== false && state.token) headers.Authorization = 'Bearer ' + state.token;
    var body;
    if (options.body instanceof FormData) {
      body = options.body;
    } else if (options.body !== undefined && options.body !== null) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(options.body);
    }
    var controller = new AbortController();
    var timeout = window.setTimeout(function () { controller.abort(); }, 10000);
    try {
      var response = await fetch(normalizeBaseUrl(state.baseUrl) + path, { method: method, headers: headers, body: body, signal: controller.signal });
      var raw = await response.text();
      var payload = {};
      if (raw) {
        try { payload = JSON.parse(raw); }
        catch (error) { payload = { error: { code: 'invalid_response', message: raw } }; }
      }
      var result = {
        ok: response.ok && payload.ok !== false,
        status: response.status,
        data: payload.data || (payload.ok === undefined ? payload : {}),
        error: payload.error || null
      };
      if (result.status === 401 && path !== '/api/auth/login') endSession('会话已过期，请重新登录');
      return result;
    } catch (error) {
      return failure(0, error.name === 'AbortError' ? 'timeout' : 'network_error',
        error.name === 'AbortError' ? '请求超时，请稍后重试' : '无法连接到服务');
    } finally {
      clearTimeout(timeout);
    }
  }

  function request(path, options) {
    return state.demo ? demoRequest(path, options) : httpRequest(path, options);
  }

  function updateAuthUi() {

    $('sidebarUser').textContent = displayName(user);
    $('sidebarRole').textContent = labels.role[user.role] || user.role || '-';
    $('createPanelButton').classList.toggle('hidden', user.role !== 'admin');
    $('createIssueButton').disabled = user.role === 'guest';

  function endSession(message) {
    state.token = '';
    state.currentUser = null;
    state.blocks = [];
    state.issues = [];
    state.selectedBlockId = null;
    state.selectedIssueId = null;
    state.selectedTaskId = null;
    sessionStorage.removeItem(storageKeys.token);
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('profileMenu').classList.add('hidden');

  async function login(event) {
    event.preventDefault();
    var username = $('loginUsername').value.trim();
    var password = $('loginPassword').value;
    $('loginError').textContent = '';
    if (!username || !password) {
      $('loginError').textContent = '请输入用户名和密码';
      return;
    }
    var button = $('loginButton');
    setBusy(button, true, '登录中');
    var result = await request('/api/auth/login', { method: 'POST', auth: false, body: { username: username, password: password } });
    setBusy(button, false);
    if (!result.ok) {
      $('loginError').textContent = resultMessage(result, '登录失败');
      return;
    }
    state.token = result.data.token || '';
    state.currentUser = result.data.user || null;
    sessionStorage.setItem(storageKeys.token, state.token);
    $('loginPassword').value = '';
    await enterApp();

  async function restoreSession() {
    if (!state.token) return false;
    var result = await request('/api/auth/me');
    if (!result.ok) return false;
    state.currentUser = result.data.user || null;
    await enterApp();
    return true;

  async function enterApp() {

  async function loadBlocks() {
    $('panelList').innerHTML = '<div class="list-state"><div class="list-state-inner">正在加载面板</div></div>';

      html += '<span class="issue-cell">' + escapeHtml(displayName(assignee)) + '</span>';

  function renderAssigneeFilter() {

  function canEditIssue(issue) {
    if (!state.currentUser || !issue) return false;
    return state.currentUser.role === 'admin' || (state.currentUser.role === 'user' && Number(issue.reporter_id) === Number(state.currentUser.id));
  }

  function canChangeIssueStatus(issue, status) {
    if (!state.currentUser || !issue) return false;
    if (canEditIssue(issue)) return true;
    return state.currentUser.role === 'user' && Number(issue.assignee_id) === Number(state.currentUser.id) && status !== 'closed';
  }

  function canWrite() {
    return state.currentUser && state.currentUser.role !== 'guest';
  }

  async function openIssue(identifier, updateHash) {
    var numericId = parseTaskId(identifier);
    if (!numericId) {
      showToast('TaskID 格式无效');
      return;
    }
    var requestedTaskId = formatTaskId(numericId);
    if (updateHash !== false && !$('workspace').classList.contains('detail-open')) {
      state.returnHash = window.location.hash || (state.selectedBlockId ? '#/boards/' + state.selectedBlockId : '#/');
      state.returnScrollY = window.scrollY;
    }
    state.selectedIssueId = numericId;
    state.selectedTaskId = requestedTaskId;
    $('issueDetailView').classList.remove('hidden');
    $('workspace').classList.add('detail-open');
    $('appView').classList.add('detail-mode');
    $('detailTitle').textContent = '正在加载 Issue';
    $('detailTaskId').textContent = requestedTaskId;
    $('detailTaskId').dataset.taskId = requestedTaskId;
    $('detailHeadActions').innerHTML = '';
    $('detailConversation').innerHTML = '<div class="list-state"><div class="list-state-inner">正在加载详情</div></div>';
    $('detailSidebar').innerHTML = '';
    if (updateHash !== false) {
      var nextHash = '#/issues/' + requestedTaskId;
      if (window.location.hash !== nextHash) history.pushState(null, '', nextHash);
    }
    var results = await Promise.all([
      request('/api/issues/' + requestedTaskId),
      request('/api/issues/' + requestedTaskId + '/comments')
    ]);
    if (!results[0].ok) {
      showToast(resultMessage(results[0], 'Issue 加载失败'));
      closeDetail(true);
      return;
    }
    state.selectedIssue = normalizeIssue(results[0].data.issue || null);
    state.selectedIssueId = Number(state.selectedIssue.id);
    state.selectedTaskId = taskIdFor(state.selectedIssue);
    state.comments = results[1].ok && Array.isArray(results[1].data.comments)
      ? results[1].data.comments.slice().sort(function (left, right) {
          var timeOrder = String(left.created_at || '').localeCompare(String(right.created_at || ''));
          return timeOrder || Number(left.id || 0) - Number(right.id || 0);
        })
      : [];
    if (state.selectedIssue && Number(state.selectedIssue.block_id) !== Number(state.selectedBlockId)) {
      state.selectedBlockId = Number(state.selectedIssue.block_id);
      renderBlocks();
    }
    if (!state.returnHash) {
      state.returnHash = state.selectedBlockId ? '#/boards/' + state.selectedBlockId : '#/';
      state.returnScrollY = 0;
    }
    renderDetail();
  }

  function attachmentUrl(attachment) {
    if (attachment.preview_url) return attachment.preview_url;
    if (attachment.demo_asset) return $('brandAsset').src;
    return '';
  }

  function attachmentIsImage(attachment) {
    return Boolean(attachment && (attachment.is_image ||
      String(attachment.content_type || '').toLowerCase().indexOf('image/') === 0 ||
      /\.(png|jpe?g|webp)$/i.test(attachment.filename || '')));
  }

  function formatFileSize(value) {
    var size = Number(value || 0);
    if (size < 1024) return size + ' B';
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
    return (size / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function commentContentHtml(comment) {
    var content = String(comment.content || '');
    var attachments = Array.isArray(comment.attachments) ? comment.attachments : [];
    var byId = {};
    attachments.forEach(function (attachment) { byId[String(attachment.id)] = attachment; });
    var html = '';
    var cursor = 0;
    var marker = /(!?)\[([^\]\r\n]*)\]\(attachment:(\d+)\)/g;
    var match;
    while ((match = marker.exec(content))) {
      html += escapeHtml(content.slice(cursor, match.index));
      var attachment = byId[match[3]];
      if (attachment) {
        var label = match[2] || attachment.filename;
        if (attachmentIsImage(attachment)) {
          var source = attachmentUrl(attachment);
          html += '<button class="comment-image" type="button" data-action="preview-image" data-attachment-id="' + Number(attachment.id) + '" data-image-alt="' + escapeHtml(label) + '">' +
            '<img alt="' + escapeHtml(label) + '" data-attachment-image="' + Number(attachment.id) + '"' + (source ? ' src="' + escapeHtml(source) + '"' : '') + '></button>';
        } else {
          html += '<a class="comment-file" href="#" data-action="download-attachment" data-attachment-id="' + Number(attachment.id) + '" data-file-name="' + escapeHtml(attachment.filename) + '">' +
            icon('paperclip') + '<span class="comment-file-name">' + escapeHtml(attachment.filename) + '</span>' +
            '<span class="comment-file-size">' + formatFileSize(attachment.file_size) + '</span>' + icon('download') + '</a>';
        }
      } else {
        html += escapeHtml(match[0]);
      }
      cursor = marker.lastIndex;
    }
    html += escapeHtml(content.slice(cursor));
    return html.replace(/\r?\n/g, '<br>');
  }

  function releaseAttachmentObjectUrls() {
    state.attachmentLoadVersion += 1;
    state.attachmentObjectUrls.forEach(function (url) { URL.revokeObjectURL(url); });
    state.attachmentObjectUrls = [];
    state.attachmentPreviewUrls.forEach(function (url) { URL.revokeObjectURL(url); });
    state.attachmentPreviewUrls = [];
  }

  async function loadAttachmentImages() {
    if (state.demo) return;
    var loadVersion = state.attachmentLoadVersion;
    var images = Array.from(document.querySelectorAll('[data-attachment-image]'));
    await Promise.all(images.map(async function (image) {
      try {
        var response = await fetch(
          normalizeBaseUrl(state.baseUrl) + '/api/attachments/' + Number(image.dataset.attachmentImage) + '?size=thumb',
          { headers: { Authorization: 'Bearer ' + state.token }, cache: 'no-store' }
        );
        if (!response.ok) return;
        var objectUrl = URL.createObjectURL(await response.blob());
        if (loadVersion !== state.attachmentLoadVersion || !image.isConnected) {
          URL.revokeObjectURL(objectUrl);
          return;
        }
        state.attachmentObjectUrls.push(objectUrl);
        image.src = objectUrl;
      } catch (error) {
        image.removeAttribute('src');
      }
    }));
  }

  async function previewAttachment(id, alt) {
    var dialog = $('imagePreviewDialog');
    var image = $('imagePreview');
    if (!dialog || !image) return;
    image.removeAttribute('src');
    image.alt = alt || '图片预览';
    if (state.demo) {
      var demoAttachment = demo.attachments.find(function (item) { return Number(item.id) === Number(id); });
      image.src = attachmentUrl(demoAttachment || {});
    } else {
      try {
        var response = await fetch(
          normalizeBaseUrl(state.baseUrl) + '/api/attachments/' + Number(id),
          { headers: { Authorization: 'Bearer ' + state.token }, cache: 'no-store' }
        );
        if (!response.ok) throw new Error('image');
        var objectUrl = URL.createObjectURL(await response.blob());
        state.attachmentPreviewUrls.push(objectUrl);
        image.src = objectUrl;
      } catch (error) {
        showToast('图片加载失败');
        return;
      }
    }
    if (!dialog.open) dialog.showModal();
  }

  async function downloadAttachment(id, filename) {
    var objectUrl = '';
    try {
      if (state.demo) {
        var demoAttachment = demo.attachments.find(function (item) { return Number(item.id) === Number(id); });
        objectUrl = attachmentUrl(demoAttachment || {});
      } else {
        var response = await fetch(
          normalizeBaseUrl(state.baseUrl) + '/api/attachments/' + Number(id),
          { headers: { Authorization: 'Bearer ' + state.token }, cache: 'no-store' }
        );
        if (!response.ok) throw new Error('download');
        objectUrl = URL.createObjectURL(await response.blob());
      }
      if (!objectUrl) throw new Error('download');
      var link = document.createElement('a');
      link.href = objectUrl;
      link.download = filename || 'attachment';
      document.body.appendChild(link);
      link.click();
      link.remove();
      if (!state.demo) window.setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 0);
    } catch (error) {
      showToast('附件下载失败');
    }
  }

  function renderCommentFileList() {
    var list = $('commentFileList');
    if (!list) return;
    var files = state.commentImages || [];
    list.innerHTML = files.map(function (file, index) {
      return '<div class="comment-file-row"><span class="comment-file-name">' + icon('paperclip') + escapeHtml(file.name) + '</span>' +
        '<span class="comment-file-size">' + formatFileSize(file.size) + '</span>' +
        '<button class="comment-file-remove" type="button" data-action="remove-comment-file" data-file-index="' + index + '" aria-label="移除附件">' + icon('x') + '</button></div>';
    }).join('');
    var hint = $('commentImageHint');
    if (hint) hint.textContent = files.length ? files.length + ' 个附件待发布' : '支持图片、日志和常见附件';
  }

  function removeCommentFile(index) {
    var files = state.commentImages || [];
    if (index < 0 || index >= files.length) return;
    var textarea = $('commentContent');
    if (textarea) {
      textarea.value = textarea.value.replace(/(!?)\[([^\]\r\n]*)\]\(upload:(\d+)\)/g,
        function (marker, bang, label, rawIndex) {
          var markerIndex = Number(rawIndex);
          if (markerIndex === index) return '';
          return (markerIndex > index ? bang + '[' + label + '](upload:' + (markerIndex - 1) + ')' : marker);
        });
    }
    files.splice(index, 1);
    renderCommentFileList();
  }

  function closeAttachmentPreview() {
    if ($('imagePreviewDialog').open) $('imagePreviewDialog').close();
    $('imagePreview').removeAttribute('src');
    state.attachmentPreviewUrls.forEach(function (url) { URL.revokeObjectURL(url); });
    state.attachmentPreviewUrls = [];
  }

  function renderDetail() {
    var issue = state.selectedIssue;
    if (!issue) return;
    state.commentImages = [];
    releaseAttachmentObjectUrls();
    var editable = canEditIssue(issue);
    var admin = state.currentUser && state.currentUser.role === 'admin';
    var write = canWrite();
    var reporter = issue.reporter || null;
    var assignee = issue.assignee || null;

    $('detailTaskId').dataset.taskId = taskId;
    $('detailTitle').textContent = issue.title;

    var actions = '';
    if (editable) actions += '<button class="btn-ghost" type="button" data-action="edit-issue" data-id="' + Number(issue.id) + '">' + icon('edit') + '编辑</button>';

    $('detailHeadActions').innerHTML = actions;

    var conversation = '<section class="detail-section"><h3>描述</h3><p class="detail-description">' + escapeHtml(issue.description || '无描述') + '</p></section>';
    conversation += '<section class="detail-section"><h3>讨论</h3><div class="comment-list">';
    if (state.comments.length) {
      state.comments.forEach(function (comment) {
        conversation += '<article class="comment"><span class="avatar">' + escapeHtml(initials(comment.user)) + '</span><div>';
        conversation += '<div class="comment-head"><strong>' + escapeHtml(displayName(comment.user)) + '</strong><span>' + escapeHtml(formatDate(comment.created_at)) + '</span></div>';
        conversation += '<div class="comment-body">' + commentContentHtml(comment) + '</div></div></article>';
      });
    } else {
      conversation += '<p class="detail-description">暂无评论</p>';
    }
    conversation += '</div>';
    if (write) {
      conversation += '<form class="comment-form" id="commentForm"><label class="sr-only" for="commentContent">发表评论</label>';

  async function saveIssue() {
    var title = $('issueTitle').value.trim();
    if (!title) {
      $('formError').textContent = '请输入 Issue 标题';
      return;
    }
    var payload = {
      title: title,
      description: $('issueDescription').value.trim(),
      block_id: Number($('issueBlock').value),
      priority: $('issuePriority').value,
      assignee_id: $('issueAssignee').value ? Number($('issueAssignee').value) : null
    };
    var editing = state.modalMode === 'edit-issue';
    var path = editing ? '/api/issues/' + formatTaskId(state.editingId) : '/api/issues';
    var result = await request(path, { method: editing ? 'PUT' : 'POST', body: payload });
    if (!result.ok) {
      $('formError').textContent = resultMessage(result, 'Issue 保存失败');
      return;
    }
    var issue = result.data.issue;
    closeFormDialog();
    state.selectedBlockId = Number(issue && issue.block_id || payload.block_id);
    await loadBlocks();
    await selectBlock(state.selectedBlockId, false);
    if (issue) await openIssue(taskIdFor(issue), true);
    showToast(editing ? 'Issue 已更新' : 'Issue 已创建');
  }

  async function savePassword() {

    var result = await request('/api/auth/password', { method: 'PUT', body: { new_password: password } });

    if (result.data.token) {

  async function submitComment(event) {
    event.preventDefault();
    var content = $('commentContent').value.trim();
    var selectedFiles = state.commentImages || [];
    var files = [];
    var seenIndexes = {};
    var invalidReference = false;
    content = content.replace(/(!?)\[([^\]\r\n]*)\]\(upload:(\d+)\)/g, function (marker, bang, label, rawIndex) {
      var sourceIndex = Number(rawIndex);
      if (!selectedFiles[sourceIndex] || seenIndexes[sourceIndex]) {
        invalidReference = true;
        return marker;
      }
      seenIndexes[sourceIndex] = true;
      var nextIndex = files.length;
      files.push(selectedFiles[sourceIndex]);
      return bang + '[' + label + '](upload:' + nextIndex + ')';
    });
    if (invalidReference || content.indexOf('upload:') >= 0 && !files.length) {
      showToast('评论中的附件引用无效');
      return;
    }
    if (!content && !files.length) return;
    if (files.length > 9) {
      showToast('每条评论最多添加 9 个附件');
      return;
    }
    var button = event.submitter;
    setBusy(button, true, '发表中');
    var result;
    if (!files.length) {
      result = await request('/api/issues/' + state.selectedTaskId + '/comments', { method: 'POST', body: { content: content } });
    } else {
      var form = new FormData();
      form.append('content', content);
      files.forEach(function (file) { form.append('files', file); });
      result = await request('/api/issues/' + state.selectedTaskId + '/comments', { method: 'POST', body: form });
    }
    setBusy(button, false);
    if (!result.ok) {
      showToast(resultMessage(result, '评论发表失败'));
      return;
    }
    await openIssue(state.selectedTaskId, false);
    await loadIssues();
    showToast('评论已发表');
  }

  function insertCommentImages(event) {
    var input = event.target;
    var selectedFiles = Array.from(input.files || []);
    var files = selectedFiles.filter(function (file) {
      var type = String(file.type || '').toLowerCase();
      return /^image\/(png|jpeg|webp)$/.test(type) ||
        /\.(png|jpe?g|webp|txt|log|json|xml|csv|md|pdf|zip|bin|doc|docx|docm|dot|dotx|dotm|xls|xlsx|xlsm|xlt|xltx|xltm|ppt|pptx|pptm|pot|potx|potm)$/i.test(file.name || '');
    });
    if (files.length !== selectedFiles.length) {
      showToast('存在不支持的附件类型');
    }
    if (!files.length) return;
    var current = state.commentImages || [];
    if (current.length + files.length > 9) {
      showToast('每条评论最多添加 9 个附件');
      input.value = '';
      return;
    }
    var textarea = $('commentContent');
    var start = textarea.selectionStart;
    var end = textarea.selectionEnd;
    var prefix = textarea.value.slice(0, start);
    var suffix = textarea.value.slice(end);
    var markers = files.map(function (file, index) {
      var uploadIndex = current.length + index;
      var safeName = file.name.replace(/[\[\]]/g, '');
      var isImage = /^image\/(png|jpeg|webp)$/.test(String(file.type || '').toLowerCase()) ||
        /\.(png|jpe?g|webp)$/i.test(file.name || '');
      return (isImage ? '![' : '[') + safeName + '](upload:' + uploadIndex + ')';
    }).join('\n');
    textarea.value = prefix + markers + suffix;
    state.commentImages = current.concat(files);
    var nextPosition = prefix.length + markers.length;
    textarea.focus();
    textarea.setSelectionRange(nextPosition, nextPosition);
    renderCommentFileList();
    input.value = '';
  }

  async function copyTaskId(taskId) {
    if (!parseTaskId(taskId)) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(taskId);
      } else {
        var temporary = document.createElement('textarea');
        temporary.value = taskId;
        temporary.setAttribute('readonly', '');
        temporary.style.position = 'fixed';
        temporary.style.opacity = '0';
        document.body.appendChild(temporary);
        temporary.select();
        document.execCommand('copy');
        temporary.remove();
      }
      showToast('已复制 ' + taskId);
    } catch (error) {
      showToast('无法复制 TaskID');
    }
  }

  async function applyRoute() {
    var hash = window.location.hash || '#/';
    var issueMatch = hash.match(/^#\/issues\/([^/]+)$/);
    var blockMatch = hash.match(/^#\/boards\/(\d+)$/);
    if (issueMatch) {
      await openIssue(issueMatch[1], false);
      if (state.selectedIssue) {
        history.replaceState(null, '', '#/issues/' + state.selectedTaskId);
        await loadIssues();
        renderDetail();
      }
      return;
    }
    if (blockMatch) {
      var blockId = Number(blockMatch[1]);
      if (state.blocks.some(function (block) { return Number(block.id) === blockId; })) {
        var restoreScrollY = $('workspace').classList.contains('detail-open') ? state.returnScrollY : 0;
        await selectBlock(blockId, false);
        if (restoreScrollY) window.setTimeout(function () { window.scrollTo(0, restoreScrollY); }, 0);
        return;
      }
    }
    if (state.selectedBlockId) await selectBlock(state.selectedBlockId, false);
    else renderIssues();
  }

  async function handleClick(event) {
    var target = event.target.closest('[data-action]');
    if (!target) return;
    var action = target.dataset.action;
    var id = Number(target.dataset.id);
    if (action === 'download-attachment') {
      event.preventDefault();
      await downloadAttachment(Number(target.dataset.attachmentId), target.dataset.fileName);
      return;
    }
    if (action === 'remove-comment-file') {
      event.preventDefault();
      removeCommentFile(Number(target.dataset.fileIndex));
      return;
    }
    if (action === 'select-block') await selectBlock(id, true);
    else if (action === 'open-issue') await openIssue(target.dataset.taskId, true);
    else if (action === 'copy-task-id') await copyTaskId(target.dataset.taskId);
    else if (action === 'edit-issue') openIssueForm(state.selectedIssue);
    else if (action === 'delete-issue') await deleteIssue(id);
    else if (action === 'change-status') await changeStatus(target.dataset.status);
    else if (action === 'preview-image') await previewAttachment(Number(target.dataset.attachmentId), target.dataset.imageAlt);
    else if (action === 'close-image-preview') closeAttachmentPreview();
    else if (action === 'edit-block') {
      var block = state.blocks.find(function (item) { return Number(item.id) === id; });
      openBoardForm(block);
    } else if (action === 'move-block-up') await moveBlockUp(id);
    else if (action === 'password') {
      $('profileMenu').classList.add('hidden');
      openPasswordForm();
    } else if (action === 'logout') await logout();
    else if (action === 'close-form') closeFormDialog();
    else if (action === 'close-confirm') closeConfirmDialog();
    else if (action === 'all-issues') {
      state.selectedBlockId = null;
      closeDetail(false);
      history.pushState(null, '', '#/');
      await loadIssues();
      renderBlocks();
    }
  }

  function bindEvents() {
    $('loginForm').addEventListener('submit', login);
    $('dynamicForm').addEventListener('submit', submitDynamicForm);
    $('confirmButton').addEventListener('click', runConfirmedAction);
    $('imagePreviewDialog').addEventListener('close', closeAttachmentPreview);
    $('createIssueButton').addEventListener('click', function () { if (canWrite()) openIssueForm(null); });
    $('createPanelButton').addEventListener('click', function () { openBoardForm(null); });
    $('closeDetailButton').addEventListener('click', function () { closeDetail(true); });
    $('mobilePanelsButton').addEventListener('click', openSidebar);
    $('sidebarBackdrop').addEventListener('click', closeSidebar);
    $('profileButton').addEventListener('click', function (event) {
      event.stopPropagation();
      var menu = $('profileMenu');
      menu.classList.toggle('hidden');
      $('profileButton').setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
    });
    document.addEventListener('click', function (event) {
      handleClick(event);
      if (!event.target.closest('.profile-wrap')) {
        $('profileMenu').classList.add('hidden');
        $('profileButton').setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('keydown', function (event) {
      if (event.target.closest && event.target.closest('[data-action="copy-task-id"]')) return;
      var issueRow = event.target.closest && event.target.closest('.issue-row[data-task-id]');
      if (issueRow && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openIssue(issueRow.dataset.taskId, true);
        return;
      }
      if (event.key === 'Escape' && !$('formDialog').open && !$('confirmDialog').open) {
        if (state.sidebarOpen) closeSidebar();
        else if (state.selectedIssueId) closeDetail(true);
      }
    });
    document.querySelectorAll('[data-filter-status]').forEach(function (button) {
      button.addEventListener('click', async function () {
        state.filters.status = button.dataset.filterStatus;
        document.querySelectorAll('[data-filter-status]').forEach(function (item) { item.classList.toggle('active', item === button); });
        await loadIssues();
      });
    });
    $('priorityFilter').addEventListener('change', async function () { state.filters.priority = this.value; await loadIssues(); });
    $('assigneeFilter').addEventListener('change', async function () { state.filters.assignee = this.value; await loadIssues(); });
    $('sortFilter').addEventListener('change', async function () { state.filters.sort = this.value; await loadIssues(); });
    $('clearFiltersButton').addEventListener('click', clearFilters);
    $('issueSearch').addEventListener('input', function () {
      clearTimeout(bindEvents.searchTimer);
      state.filters.q = this.value.trim();
      bindEvents.searchTimer = window.setTimeout(loadIssues, 280);
    });
    $('issueSearch').addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') return;
      var issueId = parseTaskId(this.value.trim());
      if (!issueId) return;
      event.preventDefault();
      clearTimeout(bindEvents.searchTimer);
      openIssue(formatTaskId(issueId), true);
    });
    window.addEventListener('popstate', function () { if (state.currentUser) applyRoute(); });
    window.addEventListener('hashchange', function () { if (state.currentUser) applyRoute(); });
    document.querySelectorAll('[data-demo-user]').forEach(function (button) {
      button.addEventListener('click', function () {
        $('loginUsername').value = button.dataset.demoUser;
        $('loginPassword').value = 'demo1234';
        $('loginButton').click();
      });
    });
  }

  async function init() {
    try { state.baseUrl = normalizeBaseUrl(state.baseUrl); }
    catch (error) { state.baseUrl = defaultBaseUrl; }
    localStorage.setItem(storageKeys.baseUrl, state.baseUrl);
    $('loginDemoBadge').classList.toggle('hidden', !state.demo);
    $('appDemoBadge').classList.toggle('hidden', !state.demo);
    $('demoRoles').classList.toggle('hidden', !state.demo);
    bindEvents();
    await checkHealth();
    var autologin = state.demo ? params.get('autologin') : '';
    if (autologin) {
      var user = demo.users.find(function (item) { return item.role === autologin || item.username === autologin; });
      if (user) {
        state.demoRole = user.role;
        state.token = 'demo-token-' + user.role;
        state.currentUser = user;
        sessionStorage.setItem(storageKeys.token, state.token);
        await enterApp();
        return;
      }
    }
    await restoreSession();
  }

  init();
}());
</script>
</body>
</html>
